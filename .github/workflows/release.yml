name: Release

# Tag vX.Y.Z to publish: multi-arch images (signed, with SBOM and provenance) and the release
# assets the installer downloads, with image digests and checksums baked into install.sh, and a
# signed SHA256SUMS of them all.
on:
  push:
    tags: ["v*.*.*"] # including prereleases (v1.0.0-rc1), published as such

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signing

jobs:
  images:
    runs-on: ubuntu-24.04
    # Four multi-arch images, the workbench's arm64 half under emulation: generous, but a hung
    # build stops long before GitHub's six-hour default.
    timeout-minutes: 120
    outputs:
      app: ${{ steps.refs.outputs.app }}
      web: ${{ steps.refs.outputs.web }}
      workbench: ${{ steps.refs.outputs.workbench }}
      egress: ${{ steps.refs.outputs.egress }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Image names
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/$owner/all-the-spaces-app" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/all-the-spaces-web" >> "$GITHUB_OUTPUT"
          echo "workbench=ghcr.io/$owner/all-the-spaces-workbench" >> "$GITHUB_OUTPUT"
          echo "egress=ghcr.io/$owner/all-the-spaces-egress" >> "$GITHUB_OUTPUT"
      - id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.names.outputs.app }}:${{ github.ref_name }}
      - id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.names.outputs.web }}:${{ github.ref_name }}
      # The Studio: the workbench for sandboxes, previews and checks (no AI assistant inside), and
      # the egress proxy.
      - id: workbench
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/workbench/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.names.outputs.workbench }}:${{ github.ref_name }}
      - id: egress
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/egress/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.names.outputs.egress }}:${{ github.ref_name }}
      - name: Sign images
        run: |
          cosign sign --yes "${{ steps.names.outputs.app }}@${{ steps.app.outputs.digest }}"
          cosign sign --yes "${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}"
          cosign sign --yes "${{ steps.names.outputs.workbench }}@${{ steps.workbench.outputs.digest }}"
          cosign sign --yes "${{ steps.names.outputs.egress }}@${{ steps.egress.outputs.digest }}"
      - id: refs
        run: |
          echo "app=${{ steps.names.outputs.app }}@${{ steps.app.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "web=${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "workbench=${{ steps.names.outputs.workbench }}@${{ steps.workbench.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "egress=${{ steps.names.outputs.egress }}@${{ steps.egress.outputs.digest }}" >> "$GITHUB_OUTPUT"

  test-release-images:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, update and roll back using the published images
        env:
          SKIP_BUILD: "1"
          APP_IMAGE: ${{ needs.images.outputs.app }}
          WEB_IMAGE: ${{ needs.images.outputs.web }}
          EGRESS_IMAGE: ${{ needs.images.outputs.egress }}
          WORKBENCH_IMAGE: ${{ needs.images.outputs.workbench }}
        run: |
          docker pull "$APP_IMAGE" && docker pull "$WEB_IMAGE" && docker pull "$EGRESS_IMAGE" && docker pull "$WORKBENCH_IMAGE"
          deploy/install/test/run.sh

  publish:
    needs: [images, test-release-images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Prepare release assets
        env:
          APP: ${{ needs.images.outputs.app }}
          WEB: ${{ needs.images.outputs.web }}
          WORKBENCH: ${{ needs.images.outputs.workbench }}
          EGRESS: ${{ needs.images.outputs.egress }}
        run: |
          mkdir dist
          cp deploy/compose/compose.yml deploy/compose/garage.toml deploy/install/ats-admin deploy/install/cloud-init.yaml dist/
          compose_sha=$(sha256sum dist/compose.yml | cut -d' ' -f1)
          garage_sha=$(sha256sum dist/garage.toml | cut -d' ' -f1)
          admin_sha=$(sha256sum dist/ats-admin | cut -d' ' -f1)
          sed -e "s|__ATS_REPO__|${{ github.repository }}|" \
              -e "s|__ATS_RELEASE__|${{ github.ref_name }}|" \
              -e "s|__ATS_APP_IMAGE__|$APP|" \
              -e "s|__ATS_WEB_IMAGE__|$WEB|" \
              -e "s|__ATS_WORKBENCH_IMAGE__|$WORKBENCH|" \
              -e "s|__ATS_EGRESS_IMAGE__|$EGRESS|" \
              -e "s|__ATS_COMPOSE_SHA256__|$compose_sha|" \
              -e "s|__ATS_GARAGE_SHA256__|$garage_sha|" \
              -e "s|__ATS_ADMIN_SHA256__|$admin_sha|" \
              deploy/install/install.sh > dist/install.sh
          sed -i "s|__ATS_REPO__|${{ github.repository }}|" dist/cloud-init.yaml
          grep -q '__ATS_' dist/install.sh && { echo "installer still has placeholders"; exit 1; }
          (cd dist && sha256sum -- ./* > SHA256SUMS)
      # Keyless, like the images: anyone can check SHA256SUMS came from this workflow for this tag
      # (see docs/self-hosting.md), and the files against it.
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      # A tag like v1.0.0-rc1 is a prerelease: never "latest", which is what installs and
      # 'ats-admin update' fetch.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --generate-notes --verify-tag "${prerelease[@]}"
