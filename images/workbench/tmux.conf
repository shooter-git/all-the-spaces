# The terminal session in a workspace: quiet, scrollable, and copyable.
set -g status off
set -g mouse on
set -g history-limit 20000
# Copying (drag to select) reaches the browser's clipboard.
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 10
