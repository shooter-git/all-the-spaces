# All the Spaces — production stack. Written to /opt/all-the-spaces by install.sh.
# ATS_APP_IMAGE / ATS_WEB_IMAGE are pinned by digest for each release.
name: all-the-spaces

# Docker keeps every line a container ever logged unless told otherwise: at most 100 MB each here.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  ATS_PORT_SERVER: "3000"
  ATS_PORT_REALTIME: "2567"
  DATABASE_URL: postgres://ats:${POSTGRES_PASSWORD}@postgres:5432/ats
  VALKEY_URL: redis://valkey:6379
  S3_ENDPOINT: http://garage:3900
  GARAGE_ADMIN_URL: http://garage:3903
  SERVER_INTERNAL_URL: http://server:3000
  LIVEKIT_URL: http://livekit:7880
  ATS_SUPERVISOR_URL: http://supervisor:3140
  ATS_ASSET_CACHE: /var/cache/ats-assets
  # The worker touches this on every heartbeat, for its health check.
  ATS_HEARTBEAT_FILE: /tmp/alive

x-app: &app
  image: ${ATS_APP_IMAGE:?set by install.sh}
  restart: unless-stopped
  env_file: .env
  environment: *app-environment
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  caddy:
    image: ${ATS_WEB_IMAGE:?set by install.sh}
    restart: unless-stopped
    logging: *logging
    # Only what the Caddyfile reads: it faces the internet, so it never sees the other secrets.
    environment:
      ATS_APP_HOST: ${ATS_APP_HOST:?set by install.sh}
      ATS_PLAY_HOST: ${ATS_PLAY_HOST:?set by install.sh}
      ATS_CADDY_GLOBAL: ${ATS_CADDY_GLOBAL:-}
      ATS_TLS_DIRECTIVE: ${ATS_TLS_DIRECTIVE:-}
      ATS_TRUSTED_PROXIES: ${ATS_TRUSTED_PROXIES:-private_ranges}
    # Behind another reverse proxy (ATS_BEHIND_PROXY=1, set by install.sh --behind-proxy) it reads
    # Caddyfile.proxy instead: plain HTTP, no certificates.
    command: [caddy, run, --config, "/etc/caddy/Caddyfile${ATS_BEHIND_PROXY:+.proxy}", --adapter, caddyfile]
    ports:
      # The web's ports, on every address. Behind another reverse proxy, only plain HTTP on the one
      # address in ATS_BIND: the installer then sets ATS_CADDY_PUBLISH to "<ATS_BIND>:80", which
      # makes the three lines the same, and Compose publishes a repeated line once.
      - "${ATS_CADDY_PUBLISH:-${ATS_HTTP_PORT:-80}:80}"
      - "${ATS_CADDY_PUBLISH:-${ATS_HTTPS_PORT:-443}:443}"
      - "${ATS_CADDY_PUBLISH:-${ATS_HTTPS_PORT:-443}:443/udp}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Its admin endpoint, which only listens inside the container.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6

  server:
    <<: *app
    command: ["node", "apps/server/src/main.ts"]
    # Connectors and repository hosts (off unless you add some; see docs/connectors.md and
    # docs/repositories.md): their definitions in connectors/ and sources/, and their secrets in
    # files only this service reads.
    env_file:
      - .env
      - path: connectors.env
        required: false
      - path: sources.env
        required: false
    environment:
      <<: *app-environment
      ATS_CONNECTORS_DIR: /etc/ats/connectors
      ATS_SOURCES_DIR: /etc/ats/sources
    volumes:
      # CC0 assets downloaded for building spaces are cached here (the image itself is read-only).
      - asset-cache:/var/cache/ats-assets
      - ./connectors:/etc/ats/connectors:ro
      - ./sources:/etc/ats/sources:ro
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      garage: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  realtime:
    <<: *app
    command: ["node", "apps/realtime/src/main.ts"]
    networks: [edge, internal]
    depends_on:
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/__healthcheck').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The only service that can start containers (Architects' sandboxes, live previews and the
  # checks that run before publishing), from a small fixed set of templates. See docs/security.md.
  supervisor:
    <<: *app
    command: ["node", "apps/supervisor/src/main.ts"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      ATS_PORT_SUPERVISOR: "3140"
      # Everything it creates is named and labelled after this installation's Compose project.
      ATS_INSTANCE: ${ATS_INSTANCE:-all-the-spaces}
      ATS_WORKBENCH_IMAGE: ${ATS_WORKBENCH_IMAGE:?set by install.sh}
      ATS_SANDBOX_NETWORK: ${ATS_INSTANCE:-all-the-spaces}_sandbox
      ATS_EGRESS_URL: http://egress:3128
      ATS_EGRESS_CONTAINER: ${ATS_INSTANCE:-all-the-spaces}-egress-1
      ATS_SANDBOX_RUNTIME: ${ATS_SANDBOX_RUNTIME:-runsc}
      # Its only secrets: it checks the server's tickets, and signs the passes of workspaces whose
      # group allows the whole internet (the egress proxy checks them). No database, storage or
      # sign-in secrets.
      SUPERVISOR_SECRET: ${SUPERVISOR_SECRET:?set by install.sh}
      EGRESS_SECRET: ${EGRESS_SECRET:-}
    # API-key mode (off unless you choose it): ATS_API_KEY_MODE=on and the keys, in a file only
    # this service reads. See docs/self-hosting.md.
    env_file:
      - path: api-keys.env
        required: false
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    group_add: ["${DOCKER_GID:-999}"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3140,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The only way out of an Architect's sandbox: HTTPS to allow-listed hosts (ATS_EGRESS_EXTRA
  # adds more, comma-separated).
  egress:
    image: ${ATS_EGRESS_IMAGE:?set by install.sh}
    restart: unless-stopped
    logging: *logging
    environment:
      EGRESS_ALLOW: ${ATS_EGRESS_EXTRA:-}
      # Checks the passes of workspaces allowed the whole internet (shared with the supervisor).
      EGRESS_SECRET: ${EGRESS_SECRET:-}
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [sandbox, outside]
    healthcheck:
      # Only connects: a request would be logged as a refused one.
      test: ["CMD", "node", "-e", "require('net').connect(3128,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *app
    command: ["node", "apps/worker/src/main.ts"]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      # The heartbeat job (every minute) touches this: proof it's still taking jobs from the queue.
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('fs').statSync('/tmp/alive').mtimeMs<180000?0:1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  # Voice chat (LiveKit, Apache-2.0, unmodified). Signalling goes through Caddy (/lk); the audio
  # itself flows straight between browsers and this service on two ports, which must be open to
  # the internet (the installer opens them in ufw; a cloud firewall needs them too). Passes come
  # from the real-time service; nothing is recorded.
  livekit:
    image: livekit/livekit-server:v1.13.8@sha256:ad961c9b4b064298cc08d618d772671f7c783e036001388079fa813929cc357e
    restart: unless-stopped
    logging: *logging
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: ${ATS_VOICE_TCP_PORT:-7881}
          udp_port: ${ATS_VOICE_UDP_PORT:-7882}
          node_ip: ${ATS_VOICE_IP:-}
          use_external_ip: ${ATS_VOICE_FIND_IP:-false}
        keys:
          ${LIVEKIT_API_KEY:?set by install.sh}: ${LIVEKIT_API_SECRET:?set by install.sh}
        logging:
          level: warn
    ports:
      - "${ATS_VOICE_TCP_PORT:-7881}:${ATS_VOICE_TCP_PORT:-7881}"
      - "${ATS_VOICE_UDP_PORT:-7882}:${ATS_VOICE_UDP_PORT:-7882}/udp"
    networks: [edge]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    logging: *logging
    # Docker's default 64 MB of shared memory is too little for parallel queries and big sorts.
    shm_size: 256m
    environment:
      POSTGRES_USER: ats
      POSTGRES_DB: ats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9.1-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    logging: *logging
    command: ["valkey-server", "--appendonly", "yes", "--notify-keyspace-events", "Kx"]
    volumes: [valkey:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: unless-stopped
    logging: *logging
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [internal]
    healthcheck:
      # The image has nothing but Garage itself: ask it for its own status.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  edge:
  # No route to the outside world: data services are only reachable by the app containers.
  internal:
    internal: true
  # Architects' sandboxes: no route anywhere except the egress proxy.
  sandbox:
    internal: true
  outside:

volumes:
  asset-cache:
  caddy-data:
  caddy-config:
  postgres:
  valkey:
  garage-meta:
  garage-data:
